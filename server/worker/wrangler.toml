# Optional: deploy with the Cloudflare CLI (npx wrangler deploy). The dashboard way is in README.md.
name = "atd-live"
main = "worker.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "LOTTO"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

[triggers]
# every minute 14:00–18:59 Thailand time (UTC+7)
crons = ["* 7-11 * * *"]

# Secrets (never in this file):  npx wrangler secret put FCM_SERVICE_ACCOUNT
#                                npx wrangler secret put GITHUB_TOKEN   (optional)
