name: Update lottery results

# GitHub's scheduled runs are "best effort": they can start very late or be skipped
# (on 1 Nov 2026 none of the 15:00–16:45 runs started at all). So on draw days the bot no longer
# relies on many short runs. ONE run that starts early watches by itself: it checks every 2 minutes,
# saves the result as soon as it is complete, and stops. Several start times are only back-ups:
# a later one finds the result already saved and ends in seconds.

on:
  schedule:
    # Draw days (1st, 16th, plus the day after for moved draws). Thailand time = UTC+7.
    # Start times 14:07, 14:37, 15:07, 15:37, 16:07, 17:07 Thailand time
    # (odd minutes: fewer jobs queue there than at :00 / :15 / :30).
    - cron: "7 7 1,2,16,17 * *"
    - cron: "37 7 1,2,16,17 * *"
    - cron: "7 8 1,2,16,17 * *"
    - cron: "37 8 1,2,16,17 * *"
    - cron: "7 9 1,2,16,17 * *"
    - cron: "7 10 1,2,16,17 * *"
    # Daily safety check at about 20:07 Thailand time — catches draws moved for holidays
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only — show what would change, don't save"
        type: boolean
        default: true
      watch:
        description: "Keep checking every 2 minutes until today's result is saved (draw day)"
        type: boolean
        default: false
      date:
        description: "Past draw date YYYY-MM-DD (leave empty for the latest draw)"
        required: false
        default: ""
      backfill_year:
        description: "Load every draw of this year, e.g. 2026 (leave empty normally)"
        required: false
        default: ""
      debug:
        description: "Show raw API responses in the log"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lottery-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch, check and save results
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          WATCH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.watch }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DRAW_DATE: ${{ inputs.date }}
          BACKFILL_YEAR: ${{ inputs.backfill_year }}
          DEBUG: ${{ inputs.debug }}
        run: |
          set -u
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$DRAW_DATE" ]; then ARGS="$ARGS --date $DRAW_DATE"; fi
          if [ -n "$BACKFILL_YEAR" ]; then ARGS="$ARGS --backfill $BACKFILL_YEAR"; fi
          if [ "$DEBUG" = "true" ]; then ARGS="$ARGS --debug"; fi

          git config user.name "lottery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit and push whatever the script changed (pull first: someone may have pushed meanwhile).
          save() {
            [ "$DRY_RUN" = "true" ] && return 0
            git add lottery.json history next_draw.json 2>/dev/null || git add lottery.json history
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "Auto-update lottery results"
            for try in 1 2 3; do
              git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" && git push -q && { echo "Saved and pushed."; return 0; }
              sleep 10
            done
            echo "::warning::push failed"
          }

          TODAY=$(TZ=Asia/Bangkok date +%F)
          DAY=$(TZ=Asia/Bangkok date +%d)
          NEXT=$(python3 -c "import json;print((json.load(open('next_draw.json')) or {}).get('date',''))" 2>/dev/null || echo "")
          saved_today() { python3 -c "import json,sys;sys.exit(0 if json.load(open('lottery.json')).get('draw_date')=='$TODAY' else 1)"; }

          # Watch only for the latest draw on a draw day (next_draw.json says today, or the 1st/16th),
          # from a draw-day schedule or when asked by hand. Everything else is one normal run.
          WATCH=false
          if [ -z "$DRAW_DATE" ] && [ -z "$BACKFILL_YEAR" ]; then
            if [ "$WATCH_INPUT" = "true" ]; then WATCH=true; fi
            if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" != "7 13 * * *" ] \
               && { [ "$NEXT" = "$TODAY" ] || { [ "$NEXT" \< "$TODAY" ] && { [ "$DAY" = "01" ] || [ "$DAY" = "16" ]; }; }; }; then
              WATCH=true   # next_draw.json says today; or it is stale/missing and today is the 1st/16th
            fi
          fi

          if [ "$WATCH" != "true" ]; then
            STATUS=0
            python scripts/update_lottery.py $ARGS || STATUS=$?
            save
            exit $STATUS
          fi

          echo "Draw day $TODAY (next_draw.json: ${NEXT:-none}) — watching every 2 minutes until 19:30 Thailand time."
          if saved_today; then echo "Today's result is already saved."; exit 0; fi
          while :; do
            python scripts/update_lottery.py $ARGS || echo "(script reported a problem — trying again)"
            save
            if saved_today; then echo "Today's result is saved — done."; break; fi
            if [ "$DRY_RUN" = "true" ]; then echo "Dry run: one check only."; break; fi
            if [ "$(TZ=Asia/Bangkok date +%H%M)" -ge 1930 ]; then
              echo "::warning::No complete result for $TODAY by 19:30 Thailand time — stopping. The 20:07 check tries again."
              break
            fi
            sleep 120
          done
